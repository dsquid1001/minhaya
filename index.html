<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>早押し特訓</title>
<style>
:root{--bg:#070b16;--panel:#10172a;--panel2:#151e35;--line:#293552;--text:#f5f7ff;--muted:#9ba8c7;--accent:#6ea8ff;--good:#4ade80;--bad:#fb7185;--gold:#fbbf24}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#17213c 0,#070b16 55%);color:var(--text)}button{font:inherit}body{display:flex;justify-content:center}.app{width:min(760px,100%);min-height:100vh;padding:18px 14px 28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900;letter-spacing:.04em;font-size:21px}.level{font-size:13px;color:var(--muted);background:#111a30;border:1px solid var(--line);padding:7px 10px;border-radius:999px}.screen{display:none}.screen.active{display:block}.hero{padding:20px 4px 12px}.hero h1{font-size:clamp(32px,8vw,52px);line-height:1;margin:0 0 10px}.hero p{color:var(--muted);margin:0;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}.card{background:linear-gradient(145deg,var(--panel),#0d1425);border:1px solid var(--line);border-radius:20px;padding:18px;text-align:left;color:var(--text);cursor:pointer;transition:.16s;min-height:118px}.card:hover{transform:translateY(-2px);border-color:#4b638f}.card:active{transform:scale(.98)}.card b{display:block;font-size:19px;margin-bottom:7px}.card span{color:var(--muted);font-size:13px;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.stat{background:#0f1729;border:1px solid var(--line);border-radius:15px;padding:12px}.stat small{color:var(--muted);display:block}.stat strong{font-size:22px;display:block;margin-top:3px}.panel{background:rgba(16,23,42,.92);border:1px solid var(--line);border-radius:22px;padding:18px}.back{background:none;border:0;color:var(--muted);padding:4px 0;cursor:pointer;margin-bottom:12px}.genre-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.genre{padding:13px;border:1px solid var(--line);background:#111a2d;color:var(--text);border-radius:14px;cursor:pointer;text-align:left}.genre:hover{border-color:var(--accent)}.quiz-head{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:12px}.progress{height:5px;background:#1c2740;border-radius:9px;overflow:hidden;margin-bottom:20px}.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}.question{min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(24px,6vw,36px);line-height:1.6;font-weight:800;white-space:pre-wrap;padding:12px}.answer{min-height:52px;text-align:center;color:var(--muted);font-size:17px;padding:10px}.buzz{width:min(420px,88vw);aspect-ratio:2.2/1;border-radius:999px;border:7px solid #2d3b60;background:linear-gradient(#ff6b82,#d92e4c);box-shadow:0 12px 35px rgba(0,0,0,.35),inset 0 5px 0 rgba(255,255,255,.18);color:white;font-weight:1000;font-size:clamp(25px,7vw,38px);cursor:pointer;display:block;margin:8px auto 12px}.buzz:active{transform:translateY(5px);box-shadow:0 5px 15px rgba(0,0,0,.35)}.buzz:disabled{filter:grayscale(.5);opacity:.6;cursor:default}.actions{display:flex;gap:9px;justify-content:center}.action{border:1px solid var(--line);background:#141e34;color:var(--text);padding:11px 17px;border-radius:13px;cursor:pointer}.result{text-align:center}.result .big{font-size:50px;font-weight:1000}.good{color:var(--good)}.bad{color:var(--bad)}.mini{color:var(--muted);font-size:13px;line-height:1.6}.bar{height:9px;background:#1d2943;border-radius:9px;overflow:hidden;margin:8px 0 14px}.bar i{display:block;height:100%;background:var(--accent)}.weak-row{display:grid;grid-template-columns:100px 1fr 42px;align-items:center;gap:8px;font-size:13px;margin:10px 0}.weak-row .bar{margin:0}.list{display:grid;gap:9px;margin-top:12px}.mistake{background:#111a2d;border:1px solid var(--line);padding:13px;border-radius:14px}.mistake b{display:block}.mistake span{color:var(--muted);font-size:12px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:#e9eefc;color:#07101f;padding:10px 15px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:520px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.question{min-height:220px}.app{padding-top:12px}}
</style>
</head>
<body><main class="app">
<header class="top"><div class="brand">⚡ 早押し特訓</div><div id="levelBadge" class="level">Lv.1</div></header>
<section id="home" class="screen active"><div class="hero"><h1>知識を、<br>一瞬で引き出せ。</h1><p>みんはや系の早押し力を鍛えるための個人練習サイト。<br>正解数だけでなく、早く押せたかも記録します。</p></div><div class="grid"><button class="card" onclick="startFree()"><b>🎲 フリー特訓</b><span>ジャンル完全ランダム。実戦に近い状態で幅広く鍛える。</span></button><button class="card" onclick="openPractice()"><b>🎯 ジャンル特訓</b><span>苦手・好きなジャンルを狙い撃ち。</span></button><button class="card" onclick="startWeak()"><b>📉 弱点特訓</b><span>成績から自動で弱いジャンルを選びます。</span></button><button class="card" onclick="startMistakes()"><b>🔁 ミス問題</b><span>過去に間違えた問題をもう一度。</span></button><button class="card" onclick="showStats()"><b>📊 成長記録</b><span>知識力・早押し力・ジャンル別成績を確認。</span></button><button class="card" onclick="resetData()"><b>⚙️ データ初期化</b><span>端末内の練習データをリセット。</span></button></div><div class="stats"><div class="stat"><small>知識力</small><strong id="knowledge">0</strong></div><div class="stat"><small>早押し力</small><strong id="speed">0</strong></div><div class="stat"><small>正答率</small><strong id="accuracy">0%</strong></div></div></section>
<section id="practice" class="screen"><button class="back" onclick="home()">← ホーム</button><div class="panel"><h2>ジャンルを選択</h2><p class="mini">難易度は選べません。現在の成長度に合わせて問題側が調整されます。人類はすぐ難易度を選びたがりますが、今回はゲームに任せます。</p><div id="genreGrid" class="genre-grid"></div></div></section>
<section id="quiz" class="screen"><div class="quiz-head"><span id="modeLabel">フリー特訓</span><span id="countLabel">1 / 20</span></div><div class="progress"><i id="progress"></i></div><div class="panel"><div id="difficulty" class="mini" style="text-align:center"></div><div id="question" class="question"></div><div id="answer" class="answer">問題文を読み、分かった瞬間に押す</div><button id="buzz" class="buzz" onclick="buzz()">⚡ BUZZ!</button><div id="quizActions" class="actions" hidden><button class="action" onclick="mark(true)">✓ 正解</button><button class="action" onclick="mark(false)">✕ 不正解</button></div></div></section>
<section id="stats" class="screen"><button class="back" onclick="home()">← ホーム</button><div class="panel"><h2>成長記録</h2><div id="statsContent"></div></div></section>
<section id="result" class="screen"><div class="panel result"><div class="mini">特訓終了</div><div id="resultScore" class="big"></div><h2 id="resultTitle"></h2><p id="resultText" class="mini"></p><div id="resultStats"></div><button class="action" onclick="home()">ホームへ</button></div></section>
</main><div id="toast" class="toast"></div>
<script>
const GENRES=['地理','歴史','科学','文学','スポーツ','数学','言葉','芸術','社会','雑学'];
const QUESTIONS=[
['地理','日本で最も面積が大きい都道府県は？','北海道',1],['地理','日本で最も長い川は？','信濃川',1],['地理','エベレストが属する山脈は？','ヒマラヤ山脈',1],['地理','オーストラリアの首都は？','キャンベラ',2],['地理','世界で最も面積が大きい国は？','ロシア',1],
['歴史','江戸幕府を開いた人物は？','徳川家康',1],['歴史','鎌倉幕府を開いた人物は？','源頼朝',1],['歴史','本能寺の変で織田信長を襲った人物は？','明智光秀',1],['歴史','フランス革命が始まった年は？','1789年',2],['歴史','大化の改新が始まった年は？','645年',3],
['科学','水の化学式は？','H2O',1],['科学','光合成で植物が二酸化炭素から作る有機物は？','ブドウ糖',2],['科学','地球が太陽の周りを一周する時間は約何日？','365日',1],['科学','人間の血液を全身へ送り出す臓器は？','心臓',1],['科学','DNAの正式名称は？','デオキシリボ核酸',3],
['文学','『吾輩は猫である』の作者は？','夏目漱石',1],['文学','『走れメロス』の作者は？','太宰治',1],['文学','『源氏物語』を書いた人物は？','紫式部',2],['文学','『銀河鉄道の夜』の作者は？','宮沢賢治',2],['文学','『こころ』の作者は？','夏目漱石',1],
['スポーツ','サッカーで1チームが同時に出場させる選手数は？','11人',1],['スポーツ','野球で1イニングに行われるアウトの数は？','3つ',1],['スポーツ','バレーボールで1チームがコート上に出す選手数は？','6人',1],['スポーツ','テニスの四大大会を総称して何という？','グランドスラム',2],['スポーツ','オリンピックの五輪マークは何色の輪で構成される？','5色',1],
['数学','直角は何度？','90度',1],['数学','円周率を表すギリシャ文字は？','π',1],['数学','三角形の内角の和は？','180度',1],['数学','素数とは1と自分自身以外に約数を持たない何以上の自然数？','2以上',2],['数学','2の10乗はいくつ？','1024',2],
['言葉','「温故知新」の意味に最も近いものは？','昔を学び新しい知識や道理を得ること',2],['言葉','「唯一無二」の意味は？','ただ一つしかなく、二つとないこと',1],['言葉','「杞憂」とは何を心配すること？','取り越し苦労',2],['言葉','「百聞は一見に如かず」で対比されているものは？','聞くことと見ること',2],['言葉','アルファベットで最初の文字は？','A',1],
['芸術','『モナ・リザ』を描いた人物は？','レオナルド・ダ・ヴィンチ',1],['芸術','『星月夜』を描いた画家は？','フィンセント・ファン・ゴッホ',2],['芸術','ピカソが活動した国として特に知られる国は？','スペイン',2],['芸術','『運命』などで知られる作曲家は？','ベートーヴェン',1],['芸術','『四季』を作曲した人物は？','ヴィヴァルディ',2],
['社会','日本の国会を構成する二つの議院は？','衆議院と参議院',1],['社会','日本の通貨単位は？','円',1],['社会','法律を制定する日本の国家機関は？','国会',1],['社会','三権分立の三権とは立法・行政と何？','司法',1],['社会','日本国憲法で基本的人権の保障などを定める章は？','第三章',3],
['雑学','1年は通常何か月？','12か月',1],['雑学','虹は一般に何色とされる？','7色',1],['雑学','日本の国鳥は？','キジ',2],['雑学','トランプのカードはジョーカーを除くと何枚？','52枚',1],['雑学','地球上で最も大きい動物は？','シロナガスクジラ',1]
].map((x,i)=>({id:i+1,genre:x[0],q:x[1],a:x[2],base:x[3]}));
let state=JSON.parse(localStorage.getItem('hayatoku')||'null')||{answered:0,correct:0,totalTime:0,early:0,genres:{},mistakes:[],recent:[]};
let session={mode:'',genre:null,queue:[],index:0,current:null,start:0,buzzAt:0,waiting:false,score:0,correct:0};
function save(){localStorage.setItem('hayatoku',JSON.stringify(state))}
function level(){return Math.max(1,Math.floor((state.correct*1.5+state.early*2+state.answered*.35)/8)+1)}
function knowledge(){return Math.round(state.correct*10+state.answered*1)}
function speed(){return Math.min(100,Math.round(state.early*4+state.correct*1.2))}
function accuracy(){return state.answered?Math.round(state.correct/state.answered*100):0}
function refreshHome(){document.getElementById('levelBadge').textContent='Lv.'+level();document.getElementById('knowledge').textContent=knowledge();document.getElementById('speed').textContent=speed();document.getElementById('accuracy').textContent=accuracy()+'%'}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');refreshHome()}
function home(){show('home')}
function startFree(){begin('フリー特訓',null)}
function openPractice(){const g=document.getElementById('genreGrid');g.innerHTML='';GENRES.forEach(x=>{const b=document.createElement('button');b.className='genre';b.textContent=x;b.onclick=()=>begin('ジャンル特訓',x);g.appendChild(b)});show('practice')}
function weakest(){let best=GENRES[0],score=Infinity;GENRES.forEach(g=>{const d=state.genres[g]||{a:0,c:0,t:0};const s=d.a<3?0:d.c/d.a;if(s<score){score=s;best=g}});return best}
function startWeak(){begin('弱点特訓',weakest())}
function startMistakes(){if(!state.mistakes.length){toast('まだミス問題がありません');return}begin('ミス問題',null,state.mistakes.map(id=>QUESTIONS.find(q=>q.id===id)).filter(Boolean))}
function difficultyFor(q){return Math.min(3,Math.max(1,q.base+(level()>=10?1:0)))}
function begin(mode,genre,custom){session={mode,genre,queue:[],index:0,current:null,start:0,buzzAt:0,waiting:false,score:0,correct:0};let pool=custom||QUESTIONS.filter(q=>!genre||q.genre===genre);if(!pool.length){toast('問題がありません');return}let shuffled=[...pool].sort(()=>Math.random()-.5);session.queue=Array.from({length:Math.min(20,shuffled.length)},(_,i)=>shuffled[i]);show('quiz');nextQuestion()}
function nextQuestion(){if(session.index>=session.queue.length){finish();return}session.current=session.queue[session.index++];session.waiting=false;session.buzzAt=0;const q=session.current;document.getElementById('modeLabel').textContent=session.mode+(session.genre?' ・ '+session.genre:'');document.getElementById('countLabel').textContent=session.index+' / '+session.queue.length;document.getElementById('progress').style.width=((session.index-1)/session.queue.length*100)+'%';document.getElementById('difficulty').textContent='自動難易度 ★'.repeat(difficultyFor(q))+'　｜　問題文が表示されます';document.getElementById('answer').textContent='分かった瞬間に押す';document.getElementById('quizActions').hidden=true;const buzz=document.getElementById('buzz');buzz.disabled=false;document.getElementById('question').textContent='';session.start=performance.now();revealQuestion(q)}
function revealQuestion(q){const text=q.q;let n=0;const interval=setInterval(()=>{if(session.waiting||session.current!==q){clearInterval(interval);return}n++;document.getElementById('question').textContent=text.slice(0,n);if(n>=text.length)clearInterval(interval)},Math.max(35,170-level()*5))}
function buzz(){if(session.waiting)return;session.buzzAt=performance.now();session.waiting=true;const elapsed=(session.buzzAt-session.start)/1000;document.getElementById('buzz').disabled=true;document.getElementById('answer').innerHTML='答え：<b>'+escapeHtml(session.current.a)+'</b><br><span>'+elapsed.toFixed(2)+'秒でBUZZ</span>';document.getElementById('quizActions').hidden=false}
function mark(ok){const q=session.current;const elapsed=(session.buzzAt?session.buzzAt:performance.now())-session.start;const sec=elapsed/1000;state.answered++;state.totalTime+=sec;const g=state.genres[q.genre]||(state.genres[q.genre]={a:0,c:0,t:0});g.a++;g.t+=sec;if(ok){state.correct++;g.c++;session.correct++;session.score+=Math.max(10,Math.round(100-Math.min(90,sec*15))+difficultyFor(q)*8);if(sec<4){state.early++;session.score+=10}}else{if(!state.mistakes.includes(q.id))state.mistakes.unshift(q.id);state.mistakes=state.mistakes.slice(0,100)}save();toast(ok?'正解！':'記録しました');setTimeout(nextQuestion,250)}
function finish(){show('result');const n=session.queue.length;const pct=n?Math.round(session.correct/n*100):0;document.getElementById('resultScore').textContent=session.score+' pt';document.getElementById('resultTitle').textContent=pct>=80?'かなり強い。':'まだ伸びる。';document.getElementById('resultText').textContent=`${session.correct} / ${n} 正解　・　正答率 ${pct}%　・　現在 Lv.${level()}`;document.getElementById('resultStats').innerHTML='<p class="mini">知識力 '+knowledge()+'　｜　早押し力 '+speed()+'　｜　総正答率 '+accuracy()+'%</p>'}
function showStats(){let html='<div class="stats"><div class="stat"><small>Lv.</small><strong>'+level()+'</strong></div><div class="stat"><small>問題数</small><strong>'+state.answered+'</strong></div><div class="stat"><small>正解</small><strong>'+state.correct+'</strong></div></div><h3>ジャンル別</h3>';GENRES.forEach(g=>{const d=state.genres[g]||{a:0,c:0};const p=d.a?Math.round(d.c/d.a*100):0;html+=`<div class="weak-row"><span>${g}</span><div class="bar"><i style="width:${p}%"></i></div><b>${p}%</b></div>`});html+='<h3>ミス問題</h3>';if(!state.mistakes.length)html+='<p class="mini">まだありません。</p>';else html+='<div class="list">'+state.mistakes.slice(0,8).map(id=>{const q=QUESTIONS.find(x=>x.id===id);return q?`<div class="mistake"><b>${escapeHtml(q.q)}</b><span>${q.genre} ・ 答え：${escapeHtml(q.a)}</span></div>`:''}).join('')+'</div>';document.getElementById('statsContent').innerHTML=html;show('stats')}
function resetData(){if(confirm('端末に保存した練習データを削除します。')){localStorage.removeItem('hayatoku');state={answered:0,correct:0,totalTime:0,early:0,genres:{},mistakes:[],recent:[]};home();toast('初期化しました')}}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
let toastTimer;function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),1000)}
refreshHome();
</script></body></html>
