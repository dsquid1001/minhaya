<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>早押し特訓</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080c18;color:#f4f7ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}button{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:900}.stats{font-size:13px;color:#aeb9d5}.screen{display:none}.screen.active{display:block}.hero{padding:28px 4px 18px}.hero h1{font-size:38px;margin:0 0 8px}.hero p{color:#aeb9d5;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:1px solid #27304a;background:#11182b;border-radius:18px;padding:18px;text-align:left;color:white;cursor:pointer;min-height:120px}.card b{display:block;font-size:20px;margin-bottom:8px}.card span{font-size:13px;color:#aeb9d5}.wide{grid-column:1/-1}.back{border:0;background:none;color:#aeb9d5;padding:8px 0;cursor:pointer}.quiz{padding-top:12px}.qtop{display:flex;justify-content:space-between;color:#aeb9d5;font-size:13px}.meter{height:5px;background:#202942;border-radius:5px;margin:10px 0 22px;overflow:hidden}.meter i{display:block;height:100%;background:#6d8cff;width:0}.question{font-size:clamp(25px,6vw,42px);line-height:1.5;font-weight:800;min-height:210px;display:flex;align-items:center}.buzz{width:100%;height:130px;border:0;border-radius:28px;background:#d52f45;color:white;font-size:42px;font-weight:1000;box-shadow:0 8px 0 #7d1727;cursor:pointer;touch-action:manipulation}.buzz:active{transform:translateY(5px);box-shadow:0 3px 0 #7d1727}.answer{margin-top:18px;padding:18px;border-radius:16px;background:#11182b;border:1px solid #27304a}.answer button{margin-top:12px;border:0;border-radius:12px;padding:13px 18px;background:#6d8cff;color:#fff;font-weight:800;cursor:pointer}.hidden{display:none!important}.choices{display:grid;gap:9px;margin:10px 0}.choices button{padding:14px;border:1px solid #303b59;border-radius:12px;background:#151d32;color:#fff;text-align:left;cursor:pointer}.pill{display:inline-block;background:#1b2642;border-radius:999px;padding:5px 9px;margin:3px;font-size:12px}.section{background:#11182b;border:1px solid #27304a;border-radius:18px;padding:18px;margin-top:14px}.bar{height:9px;background:#202942;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#6d8cff}.result{text-align:center;padding:30px 0}.big{font-size:54px;font-weight:1000}
@media(max-width:560px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.hero h1{font-size:32px}.question{min-height:250px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">⚡ 早押し特訓</div><div id="level" class="stats"></div></header>
<section id="home" class="screen active"><div class="hero"><h1>知識と早押しを鍛える。</h1><p>みんはや系の実戦感覚を、ひとりでひたすら鍛える。人間、知識を増やすより先にボタンを押したくなる生き物です。</p></div><div class="grid"><button class="card" onclick="start('free')"><b>🎲 フリー特訓</b><span>ジャンル完全ランダム。実戦向け。</span></button><button class="card" onclick="genreSelect()"><b>🎯 ジャンル特訓</b><span>好きな分野を集中練習。</span></button><button class="card" onclick="start('weak')"><b>📉 弱点特訓</b><span>成績から苦手ジャンルを自動選択。</span></button><button class="card" onclick="start('mistakes')"><b>🔁 ミス問題</b><span>過去に間違えた問題を復習。</span></button><button class="card wide" onclick="showStats()"><b>📊 成績・成長</b><span>知識力、早押し力、ジャンル別成績を確認。</span></button></div></section>
<section id="genres" class="screen"><button class="back" onclick="show('home')">← 戻る</button><h2>ジャンルを選択</h2><div id="genreGrid" class="grid"></div></section>
<section id="quiz" class="screen quiz"><div class="qtop"><span id="qcount"></span><span id="qgenre"></span></div><div class="meter"><i id="meter"></i></div><div id="question" class="question"></div><button id="buzz" class="buzz" onclick="buzz()">BUZZ!</button><div id="answer" class="answer hidden"></div></section>
<section id="result" class="screen"><div class="result"><h2>特訓終了</h2><div id="resultScore" class="big"></div><p id="resultText"></p><button class="card" onclick="show('home')">ホームへ戻る</button></div></section>
<section id="stats" class="screen"><button class="back" onclick="show('home')">← 戻る</button><h2>成績・成長</h2><div id="statsBody"></div></section>
</div>
<script>
const genres=['地理','歴史','科学','文学','スポーツ','数学','言葉','芸術','社会','雑学','アニメ','ボカロ'];
const questions=[
['地理','日本で最も面積が大きい都道府県は？','北海道'],['歴史','鎌倉幕府を開いた人物は？','源頼朝'],['科学','水の化学式は？','H2O'],['文学','「走れメロス」の作者は？','太宰治'],['スポーツ','サッカーで1チームのフィールド上の人数は？','11人'],['数学','三角形の内角の和は何度？','180度'],['言葉','「百聞は一見にしかず」の意味に最も近いものは？','実際に見る方が確かである'],['芸術','「モナ・リザ」を描いた人物は？','レオナルド・ダ・ヴィンチ'],['社会','日本の国会は何院制？','二院制'],['雑学','1年は通常何日？','365日'],
['アニメ','『鬼滅の刃』で主人公の名前は？','竈門炭治郎'],['アニメ','『ONE PIECE』の主人公モンキー・D・ルフィが目指すものは？','海賊王'],['アニメ','『名探偵コナン』の主人公が子どもの姿になった原因となる薬は？','APTX4869'],['アニメ','『ドラえもん』でドラえもんの好物は？','どら焼き'],['アニメ','『進撃の巨人』の主人公エレン・イェーガーが所属する兵団は？','調査兵団'],
['ボカロ','VOCALOIDの代表的なキャラクターとして知られる青緑色の髪の歌姫は？','初音ミク'],['ボカロ','初音ミクの声のベースになった声優は？','藤田咲'],['ボカロ','『千本桜』を作詞・作曲した人物は？','黒うさP'],['ボカロ','『ロキ』を作詞・作曲したボカロPは？','みきとP'],['ボカロ','『脳漿炸裂ガール』などで知られるボカロP、れるりりの代表曲の一つは？','脳漿炸裂ガール'],
['アニメ','『SPY×FAMILY』でロイドのコードネームは？','黄昏'],['アニメ','『呪術廻戦』で五条悟が教鞭を執る学校は？','東京都立呪術高等専門学校'],['ボカロ','『シャルル』を作詞・作曲したボカロPは？','バルーン'],['ボカロ','『グッバイ宣言』を作詞・作曲したボカロPは？','Chinozo'],['アニメ','『機動戦士ガンダム』で主人公アムロ・レイが搭乗する機体は？','ガンダム'],
['地理','世界で最も面積が大きい国は？','ロシア'],['科学','太陽系で最も大きい惑星は？','木星'],['歴史','江戸幕府を開いた人物は？','徳川家康'],['スポーツ','バレーボールで1チームがコート上に出す選手数は？','6人'],['文学','『吾輩は猫である』の作者は？','夏目漱石']
].map((x,i)=>({id:i+1,genre:x[0],q:x[1],a:x[2],difficulty:1+(i%5)}));
let data=JSON.parse(localStorage.getItem('hayastats')||'null')||{correct:0,total:0,early:0,genre:{},mistakes:[]};
let mode='free',pool=[],idx=0,correct=0,buzzTime=0,startTime=0,questionTimer=null, revealed=false,selectedGenre='';
function save(){localStorage.setItem('hayastats',JSON.stringify(data));updateLevel()}
function level(){return Math.max(1,Math.floor(data.correct/8)+Math.floor(data.early/10)+1)}
function updateLevel(){document.getElementById('level').textContent='Lv.'+level()}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');updateLevel()}
function genreSelect(){let g=document.getElementById('genreGrid');g.innerHTML=genres.map(x=>`<button class="card" onclick="start('practice','${x}')"><b>${x}</b><span>集中トレーニング</span></button>`).join('');show('genres')}
function pick(){let arr=pool.filter(x=>!data.mistakes.includes(x.id));if(!arr.length)arr=pool;return arr[Math.floor(Math.random()*arr.length)]}
function start(m,g=''){mode=m;selectedGenre=g;correct=0;idx=0;
 if(m==='practice')pool=questions.filter(x=>x.genre===g);else if(m==='weak'){let gs=genres.map(x=>[x,data.genre[x]?.total?data.genre[x].correct/data.genre[x].total:0]).sort((a,b)=>a[1]-b[1]);pool=questions.filter(x=>x.genre===gs[0][0]);}else if(m==='mistakes')pool=questions.filter(x=>data.mistakes.includes(x.id));else pool=[...questions];
 if(!pool.length){alert('まだ対象問題がありません。まずフリー特訓をプレイしてください。');return}show('quiz');next()}
function next(){if(idx>=20||idx>=pool.length){finish();return}revealed=false;const q=pick();window.current=q;startTime=performance.now();document.getElementById('qcount').textContent=`${idx+1} / 20`;document.getElementById('qgenre').textContent=q.genre;document.getElementById('meter').style.width='0%';document.getElementById('buzz').disabled=false;document.getElementById('answer').classList.add('hidden');document.getElementById('question').textContent='';let n=0;clearInterval(questionTimer);questionTimer=setInterval(()=>{n++;let chars=Math.min(q.q.length,Math.ceil(n/5));document.getElementById('question').textContent=q.q.slice(0,chars);document.getElementById('meter').style.width=(chars/q.q.length*100)+'%';if(chars>=q.q.length)clearInterval(questionTimer)},100)}
function buzz(){if(revealed)return;revealed=true;clearInterval(questionTimer);buzzTime=(performance.now()-startTime)/1000;document.getElementById('buzz').disabled=true;document.getElementById('question').textContent=current.q;document.getElementById('answer').classList.remove('hidden');document.getElementById('answer').innerHTML=`<b>答え：${current.a}</b><div class="choices"><button onclick="judge(true)">⭕ 正解</button><button onclick="judge(false)">❌ 不正解</button></div><small>BUZZまで ${buzzTime.toFixed(2)}秒</small>`}
function judge(ok){data.total++;data.genre[current.genre]??={correct:0,total:0};data.genre[current.genre].total++;if(ok){correct++;data.correct++;data.genre[current.genre].correct++;if(buzzTime<3)data.early++}else{if(!data.mistakes.includes(current.id))data.mistakes.push(current.id)}save();idx++;next()}
function finish(){clearInterval(questionTimer);document.getElementById('resultScore').textContent=`${correct} / ${idx}`;document.getElementById('resultText').textContent=`正答率 ${idx?Math.round(correct/idx*100):0}%　現在Lv.${level()}`;show('result')}
function showStats(){let rows=genres.map(g=>{let x=data.genre[g]||{correct:0,total:0};let r=x.total?Math.round(x.correct/x.total*100):0;return `<div class="section"><b>${g}</b><p>${x.correct} / ${x.total}　正答率 ${r}%</p><div class="bar"><i style="width:${r}%"></i></div></div>`}).join('');document.getElementById('statsBody').innerHTML=`<div class="section"><h3>総合</h3><p>レベル：${level()}</p><p>正解：${data.correct}　回答：${data.total}</p><p>早押し：${data.early}</p><p>ミス登録：${data.mistakes.length}問</p></div>${rows}`;show('stats')}
updateLevel();
</script>
</body>
</html>
